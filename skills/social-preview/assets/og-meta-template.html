<!--
  Open Graph / Twitter card meta. Paste into the page's <head> and replace {{PLACEHOLDERS}}.
  RULES:
   - og:image / twitter:image MUST be ABSOLUTE urls (relative paths break scrapers).
   - Match the site's existing voice in the description and title copy.
   - Keep og:type "website" for apps/products; do NOT switch to "article" just to get an
     author byline. Use <meta name="author"> instead. article:author belongs only on real writeups.
   - On custom-domain GitHub Pages, public/og.png serves at https://your.domain/og.png .
-->
<meta name="author" content="{{AUTHOR}}" />
<meta name="description" content="{{DESCRIPTION}}" />
<!-- Open Graph / social preview -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{SITE_NAME}}" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:url" content="{{ABSOLUTE_URL}}" />
<meta property="og:image" content="{{ABSOLUTE_URL}}og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{TITLE}}" />
<meta name="twitter:description" content="{{TWITTER_DESCRIPTION}}" />
<meta name="twitter:image" content="{{ABSOLUTE_URL}}og.png" />
